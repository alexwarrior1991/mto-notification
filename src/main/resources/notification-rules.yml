# Las reglas de mto-notification: que merece un aviso, a quien y por que canal.
#
# Se validan al arrancar: una clave repetida, un tipo de evento que no esta en el catalogo, una
# clase de audiencia o un canal desconocidos impiden arrancar. Se sobrescribe por entorno con
# app.notification.rules-location; las variables de aqui las pisa app.notification.rules.variables.
#
# Cada regla:
#   key        identificador estable (kebab-case); es el rule_key de la notificacion
#   event      un tipo, una lista o un patron con comodin final (maintenance.order.*)
#   when       condicion SpEL sobre event, payload y vars (opcional)
#   severity   la del aviso; sin ella, la del evento
#   audiences  KIND:clave, con la clave como plantilla (#{...}); una que quede en blanco se omite
#   channels   inbox y/o email (sin ella, inbox)
#   title/body/link   plantillas; link es una ruta del backoffice (el correo la hace absoluta)
#   throttle   un disparo por regla y clave en la ventana (window ISO-8601 o 30m/1h/1d)
#
# Lo que se registra sin aviso (access.login, access.logout, las rafagas pequenas...) simplemente
# no tiene regla.

variables:
  large-burst-threshold: 50
  # El cliente con el que mto-users administra el realm: lo que no venga de el es un cambio
  # hecho fuera de la aplicacion. app.notification.rules.variables lo pisa por entorno.
  users-service-client-id: mto-users-svc
  # La cuenta de servicio con la que mto-maintenance reserva y libera material en el almacen: una
  # reserva suya tocada por otra persona deja a su orden sin material.
  maintenance-service-account: service-account-mto-maintenance-svc
  # Un ajuste negativo de esta cantidad o mas, en la unidad del material, merece aviso al almacen.
  large-adjustment-threshold: 100

rules:

  # --- Accesos (Keycloak) ---------------------------------------------------------------------

  - key: access-login-streak
    event: access.login.streak
    severity: CRITICAL
    audiences: [PROFILE:mto-users-admin, PROFILE:mto-ops]
    channels: [inbox, email]
    title: "Racha de accesos fallidos: #{payload.value}"
    body: "#{payload.count} intentos fallidos #{payload.dimension == 'username' ? 'de la cuenta' : 'desde la IP'} #{payload.value} entre #{payload.windowStart} y #{payload.windowEnd}."
    link: "/actividad/accesos?#{payload.dimension == 'username' ? 'username' : 'ipAddress'}=#{payload.value}"
    throttle:
      window: 30m
      key: "#{payload.dimension}:#{payload.value}"

  - key: access-lockout
    event: access.lockout
    severity: CRITICAL
    audiences: [PROFILE:mto-users-admin, PROFILE:mto-ops]
    channels: [inbox, email]
    title: "Cuenta bloqueada: #{event.actorUsername ?: event.subjectId}"
    body: "Keycloak ha bloqueado la cuenta #{event.actorUsername ?: event.subjectId} #{payload.permanent == true ? 'de forma permanente' : 'temporalmente'} por intentos fallidos."
    link: "/actividad/accesos?username=#{event.actorUsername}"
    throttle:
      window: 10m
      key: "#{event.actorUsername ?: event.subjectId}"

  - key: access-impersonation
    event: access.impersonation
    severity: CRITICAL
    audiences: [PROFILE:mto-users-admin, PROFILE:mto-ops]
    channels: [inbox, email]
    title: "Suplantacion de #{event.actorUsername ?: event.subjectId}"
    body: "Alguien ha iniciado sesion como #{event.actorUsername ?: event.subjectId} desde la consola de Keycloak (impersonacion)."
    link: "/actividad/accesos?username=#{event.actorUsername}"

  - key: access-password-reset
    event: [access.password.reset, access.password.changed]
    audiences: ["USER:#{event.actorUsername}"]
    channels: [inbox]
    title: "Tu contrasena ha cambiado"
    body: "Se ha #{event.type == 'access.password.reset' ? 'restablecido' : 'cambiado'} la contrasena de tu cuenta. Si no has sido tu, avisa a administracion."
    link: "/notificaciones"

  # --- Datos maestros (mto-configuration) ---------------------------------------------------------

  - key: configuration-large-burst
    event: configuration.*
    when: "event.eventCount >= vars['large-burst-threshold']"
    audiences: [PROFILE:mto-maintenance-manager, PROFILE:mto-ops]
    channels: [inbox]
    title: "#{event.eventCount} #{payload.entityName} #{payload.operation == 'created' ? 'dados de alta' : (payload.operation == 'deleted' ? 'dados de baja' : 'modificados')}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha #{payload.operation == 'created' ? 'creado' : (payload.operation == 'deleted' ? 'borrado' : 'modificado')} #{event.eventCount} #{payload.entityName} en mto-configuration entre #{payload.openedAt} y #{payload.lastEventAt}."
    link: "/actividad?category=CONFIGURATION&type=#{event.type}"

  - key: configuration-infrastructure-deleted
    event:
      - configuration.track.deleted
      - configuration.station.deleted
      - configuration.profile.deleted
      - configuration.disconnector.deleted
      - configuration.section-insulator.deleted
    severity: WARNING
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox, email]
    title: "Baja de #{payload.entityName} #{event.subjectLabel ?: event.subjectId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha dado de baja #{payload.entityName} #{event.subjectLabel ?: event.subjectId} en mto-configuration. Los activos de mantenimiento que dependan de ello quedan desactivados en origen."
    link: "/actividad?category=CONFIGURATION&subjectType=#{payload.entityName}&subjectId=#{event.subjectId}"

  - key: configuration-package-created
    event: configuration.execution-package.created
    audiences: [PROFILE:mto-maintenance-manager, PROFILE:mto-warehouse-admin]
    channels: [inbox]
    title: "Nuevo paquete de ejecucion #{event.subjectLabel ?: event.subjectId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha creado el paquete de ejecucion #{event.subjectLabel ?: event.subjectId}; en el almacen aparece como proyecto EP-#{event.subjectId}."
    link: "/almacen/proyectos"

  # --- Trabajos de mto-configuration -------------------------------------------------------------

  - key: configuration-job-finished
    event: configuration.job.finished
    audiences: ["USER:#{payload.createdBy}"]
    channels: [inbox]
    title: "Trabajo #{payload.type} #{payload.status == 'FAILED' ? 'fallido' : 'terminado'}: #{payload.successfulItems ?: 0} correctos, #{payload.failedItems ?: 0} con error"
    body: "El trabajo #{payload.type} (#{payload.jobId}) ha terminado en estado #{payload.status}: #{payload.processedItems ?: 0} de #{payload.totalItems ?: 0} elementos procesados, #{payload.failedItems ?: 0} con error.#{payload.errorMessage != null ? ' ' + payload.errorMessage : ''}"
    link: "/trabajos"

  # --- Usuarios: lo que hace mto-users, con la persona que lo hizo ------------------------------
  # El evento de administracion de Keycloak del mismo cambio queda fundido con estos (superseded_by)
  # y no dispara nada: quien administra las cuentas se entera una vez, y con nombre.

  - key: users-user-created
    event: users.user.created
    audiences: [PROFILE:mto-users-admin]
    channels: [inbox]
    title: "Alta de usuario: #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha dado de alta la cuenta #{payload.targetUsername ?: payload.targetUserId}#{payload.enabled == false ? ', deshabilitada' : ''}#{payload.temporaryAccess == true ? ', con contrasena temporal' : ''}."
    link: "/usuarios/#{payload.targetUserId}"

  - key: users-user-deleted
    event: users.user.deleted
    severity: WARNING
    audiences: [PROFILE:mto-users-admin]
    channels: [inbox, email]
    title: "Baja de usuario: #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha borrado la cuenta #{payload.targetUsername ?: payload.targetUserId}. Sus sesiones y sus credenciales han desaparecido con ella."
    link: "/actividad?category=USERS&subjectType=user&subjectId=#{payload.targetUserId}"

  - key: users-user-disabled
    event: users.user.disabled
    audiences: [PROFILE:mto-users-admin]
    channels: [inbox]
    title: "Usuario deshabilitado: #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha deshabilitado la cuenta #{payload.targetUsername ?: payload.targetUserId}. Deshabilitar no cierra lo que ya tenia abierto: si hace falta, hay que cerrar tambien sus sesiones y sus sesiones offline."
    link: "/usuarios/#{payload.targetUserId}"

  - key: users-credential-deleted
    event: users.credential.deleted
    audiences: [PROFILE:mto-users-admin, "USER_ID:#{payload.targetUserId}"]
    channels: [inbox]
    title: "Credencial #{payload.type} retirada a #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha retirado la credencial #{payload.type} de la cuenta #{payload.targetUsername ?: payload.targetUserId}#{payload.type == 'otp' ? ': el segundo factor tendra que enrolarse de nuevo' : ''}."
    link: "/usuarios/#{payload.targetUserId}"

  - key: users-sessions-revoked
    event:
      - users.session.revoked
      - users.session.all-revoked
      - users.offline-session.revoked
      - users.offline-session.all-revoked
    audiences: [PROFILE:mto-users-admin]
    channels: [inbox]
    title: "Sesiones cerradas a #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha cerrado #{event.type matches '.*all-revoked' ? 'todas las sesiones' : 'una sesion'}#{event.type matches '.*offline.*' ? ' offline' : ''} de #{payload.targetUsername ?: payload.targetUserId}."
    link: "/usuarios/#{payload.targetUserId}"
    throttle:
      window: 5m
      key: "#{payload.targetUserId}"

  - key: users-profile-changed
    event: [users.profile.assigned, users.profile.removed]
    audiences: [PROFILE:mto-users-admin, "USER_ID:#{payload.targetUserId}"]
    channels: [inbox]
    title: "Perfil #{payload.profile} #{event.type == 'users.profile.assigned' ? 'asignado a' : 'retirado de'} #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha #{event.type == 'users.profile.assigned' ? 'asignado' : 'retirado'} el perfil #{payload.profile} #{event.type == 'users.profile.assigned' ? 'a' : 'de'} la cuenta #{payload.targetUsername ?: payload.targetUserId}. Los permisos cambian en el proximo inicio de sesion."
    link: "/usuarios/#{payload.targetUserId}"

  - key: users-client-roles-changed
    event: [users.client-roles.added, users.client-roles.removed]
    audiences: [PROFILE:mto-users-admin, "USER_ID:#{payload.targetUserId}"]
    channels: [inbox]
    title: "Permisos de #{payload.client} #{event.type == 'users.client-roles.added' ? 'anadidos a' : 'retirados de'} #{payload.targetUsername ?: payload.targetUserId}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha #{event.type == 'users.client-roles.added' ? 'anadido' : 'retirado'} los permisos #{payload.roles} de #{payload.client} #{event.type == 'users.client-roles.added' ? 'a' : 'de'} la cuenta #{payload.targetUsername ?: payload.targetUserId}."
    link: "/usuarios/#{payload.targetUserId}"

  - key: users-password-reset
    event: users.user.password-reset
    audiences: ["USER_ID:#{payload.targetUserId}"]
    channels: [inbox]
    title: "Un administrador ha cambiado tu contrasena"
    body: "#{event.actorUsername ?: 'Un administrador'} ha fijado una contrasena #{payload.temporary == false ? 'nueva' : 'temporal, que tendras que cambiar al entrar,'} para tu cuenta. Si no lo esperabas, avisa a administracion."
    link: "/notificaciones"

  # --- Usuarios: cambios hechos fuera de la aplicacion (Keycloak) --------------------------------

  - key: users-change-outside-application
    event: users.admin.*
    when: "payload.clientId != vars['users-service-client-id']"
    severity: WARNING
    audiences: [PROFILE:mto-users-admin, PROFILE:mto-ops]
    channels: [inbox, email]
    title: "Cambio en el realm fuera de la aplicacion"
    body: "Un cambio de #{payload.resourceType} (#{payload.operationType} sobre #{payload.resourcePath}) se ha hecho desde el cliente #{payload.clientId}, no desde mto-users."
    link: "/actividad?category=USERS&type=#{event.type}"
    throttle:
      window: 5m
      key: "#{event.actorId ?: payload.clientId}"

  # --- Mantenimiento (mto-maintenance) ------------------------------------------------------------
  # Lo que mto-maintenance cuenta desde su outbox, con la persona que lo hizo. Las transiciones
  # ordinarias (planificar, iniciar), un defecto leve, un punto de checklist en DEFECT y las
  # inspecciones OK se registran sin aviso.

  - key: maintenance-order-urgent
    event: maintenance.order.created
    when: "payload.type == 'URGENT'"
    severity: CRITICAL
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox, email]
    title: "Orden urgente #{payload.code}: #{payload.title}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha abierto la orden urgente #{payload.code} sobre #{payload.assetCode}#{payload.assetName != null ? ' (' + payload.assetName + ')' : ''}#{payload.trackId != null ? ', via ' + payload.trackId : ''}."
    link: "/mantenimiento/ordenes/#{event.subjectId}"

  - key: maintenance-order-assigned
    event: [maintenance.order.status-changed, maintenance.order.reassigned]
    when: "payload.assignedUser != null and (event.type == 'maintenance.order.reassigned' or payload.to == 'ASSIGNED')"
    audiences: ["USER:#{payload.assignedUser}"]
    channels: [inbox]
    title: "Orden #{payload.code} asignada a ti"
    body: "#{event.actorUsername ?: 'Un proceso'} te ha asignado la orden #{payload.code} (#{payload.title}) sobre #{payload.assetCode}#{payload.plannedDate != null ? ', prevista para el ' + payload.plannedDate : ''}#{payload.teamCode != null ? ', con el equipo ' + payload.teamCode : ''}."
    link: "/mantenimiento/ordenes/#{event.subjectId}"

  - key: maintenance-order-closed
    event: maintenance.order.status-changed
    when: "payload.to == 'COMPLETED' or payload.to == 'CANCELLED'"
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "Orden #{payload.code} #{payload.to == 'COMPLETED' ? 'completada' : 'cancelada'}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha #{payload.to == 'COMPLETED' ? 'completado' : 'cancelado'} la orden #{payload.code} (#{payload.title}) sobre #{payload.assetCode}#{payload.comment != null ? ': ' + payload.comment : ''}."
    link: "/mantenimiento/ordenes/#{event.subjectId}"

  - key: maintenance-defect-critical
    event: maintenance.defect.created
    when: "payload.severity == 'CRITICAL'"
    severity: CRITICAL
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox, email]
    title: "Defecto critico #{payload.code} en #{payload.assetCode}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha registrado el defecto critico #{payload.code} en #{payload.assetCode}: #{payload.description}#{payload.inspectionCode != null ? ' (inspeccion ' + payload.inspectionCode + ')' : ''}#{payload.orderCode != null ? ' (orden ' + payload.orderCode + ')' : ''}"
    link: "/mantenimiento/defectos/#{event.subjectId}"

  - key: maintenance-defect-high
    event: maintenance.defect.created
    when: "payload.severity == 'HIGH'"
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "Defecto grave #{payload.code} en #{payload.assetCode}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha registrado el defecto grave #{payload.code} en #{payload.assetCode}: #{payload.description}#{payload.repairPlannedDate != null ? '. Reparacion prevista para el ' + payload.repairPlannedDate : ''}"
    link: "/mantenimiento/defectos/#{event.subjectId}"

  - key: maintenance-inspection-unsafe
    event: maintenance.inspection.created
    when: "payload.result == 'UNSAFE'"
    severity: CRITICAL
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox, email]
    title: "Inspeccion #{payload.code} en #{payload.assetCode}: estado inseguro"
    body: "#{event.actorUsername ?: 'Un proceso'} ha registrado la inspeccion #{payload.code} sobre #{payload.assetCode} con resultado UNSAFE#{payload.inspector != null ? ' (inspector ' + payload.inspector + ')' : ''}. Toca abrir la orden correctiva urgente desde la inspeccion."
    link: "/mantenimiento/inspecciones/#{event.subjectId}"

  - key: maintenance-inspection-defect
    event: maintenance.inspection.created
    when: "payload.result == 'MAJOR_DEFECT' or payload.result == 'MINOR_DEFECT'"
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "Inspeccion #{payload.code} en #{payload.assetCode}: #{payload.result == 'MAJOR_DEFECT' ? 'defecto mayor' : 'defecto menor'}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha registrado la inspeccion #{payload.code} sobre #{payload.assetCode} con resultado #{payload.result}#{payload.inspector != null ? ' (inspector ' + payload.inspector + ')' : ''}."
    link: "/mantenimiento/inspecciones/#{event.subjectId}"

  - key: maintenance-inspection-corrective-order
    event: maintenance.inspection.corrective-order-created
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "Orden correctiva #{payload.orderCode} desde la inspeccion #{payload.code}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha generado la orden #{payload.orderType} #{payload.orderCode} (prioridad #{payload.priority}) desde la inspeccion #{payload.code} sobre #{payload.assetCode}#{payload.defectCode != null ? ', por el defecto ' + payload.defectCode : ''}."
    link: "/mantenimiento/ordenes/#{payload.orderId}"

  - key: maintenance-shift
    event: [maintenance.shift.started, maintenance.shift.closed]
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "Turno #{payload.code} #{event.type == 'maintenance.shift.started' ? 'iniciado' : 'cerrado'}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha #{event.type == 'maintenance.shift.started' ? 'iniciado' : 'cerrado'} el turno #{payload.code} del #{payload.shiftDate}#{payload.teamCode != null ? ' (equipo ' + payload.teamCode + ')' : ''} en las vias #{payload.trackIds}#{event.type == 'maintenance.shift.closed' and payload.netWorkMinutes != null ? ': ' + payload.netWorkMinutes + ' minutos netos' : ''}."
    link: "/mantenimiento/turnos/#{event.subjectId}"

  - key: maintenance-material-no-stock
    event: maintenance.material.rejected
    when: "payload.stockErrorCode == 'STK-001'"
    audiences: [PROFILE:mto-maintenance-manager, PROFILE:mto-warehouse-admin]
    channels: [inbox]
    title: "Sin existencias de #{payload.materialCode} para la orden #{payload.orderCode}"
    body: "El almacen no tiene #{payload.plannedQuantity} #{payload.unit} de #{payload.materialCode}#{payload.materialDescription != null ? ' (' + payload.materialDescription + ')' : ''} para la orden #{payload.orderCode}: #{payload.reason}"
    link: "/mantenimiento/ordenes/#{payload.orderId}"

  - key: maintenance-material-rejected
    event: maintenance.material.rejected
    when: "payload.stockErrorCode != 'STK-001'"
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "El almacen rechaza #{payload.materialCode} de la orden #{payload.orderCode}"
    body: "mto-stock ha rechazado #{payload.step} de #{payload.materialCode} para la orden #{payload.orderCode}#{payload.stockErrorCode != null ? ' (' + payload.stockErrorCode + ')' : ''}: #{payload.reason}"
    link: "/mantenimiento/ordenes/#{payload.orderId}"

  - key: maintenance-material-stock-unavailable
    event: [maintenance.material.failed, maintenance.material.in-doubt]
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "El almacen no responde: #{payload.materialCode} de la orden #{payload.orderCode}"
    body: "mto-stock no ha contestado a #{payload.step} de #{payload.materialCode} para la orden #{payload.orderCode}#{event.type == 'maintenance.material.in-doubt' ? ' y la peticion ' + payload.request + ' queda en duda' : ''}. Se reintenta solo cada cinco minutos; la linea tambien se puede sincronizar a mano."
    link: "/mantenimiento/ordenes/#{payload.orderId}"
    throttle:
      window: 1h
      key: "#{payload.orderId}"

  - key: maintenance-asset-disabled
    event: maintenance.asset.disabled
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox]
    title: "Activo #{payload.code} desactivado en mantenimiento"
    body: "#{event.actorUsername ?: 'Un proceso'} ha desactivado el activo #{payload.code} (#{payload.name}, #{payload.type})#{payload.sourceService != null ? ', sincronizado desde ' + payload.sourceService + ': sigue desactivado aunque el origen lo reactive, hasta que alguien lo reactive aqui' : ''}."
    link: "/mantenimiento/activos"

  - key: maintenance-preventive-due-soon
    event: maintenance.preventive.due-soon
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox, email]
    title: "#{payload.count} preventivos vencen en #{payload.horizonDays} dias#{payload.overdueCount > 0 ? ' (' + payload.overdueCount + ' ya vencidos)' : ''}"
    body: "A #{payload.date} hay #{payload.count} activos con el preventivo a vencer en los proximos #{payload.horizonDays} dias, #{payload.overdueCount} de ellos ya vencidos o nunca revisados. Los primeros: #{payload.assets.![assetCode]}."
    link: "/mantenimiento/activos"

  # --- Almacen (mto-stock) --------------------------------------------------------------------------
  # Lo que mto-stock cuenta desde su outbox. Las entradas, las salidas y las transferencias no
  # publican; una reserva liberada o cancelada por quien la creo y un ajuste por debajo del umbral
  # se registran sin aviso.

  - key: stock-material-below-minimum
    event: stock.material.below-minimum
    severity: WARNING
    audiences: [PROFILE:mto-warehouse-admin]
    channels: [inbox, email]
    title: "Material #{payload.materialCode} por debajo del minimo"
    body: "#{event.actorUsername ?: 'Un proceso'} ha dejado #{payload.materialCode}#{payload.materialName != null ? ' (' + payload.materialName + ')' : ''} en #{payload.availableAfter} #{payload.unit} disponibles, por debajo del minimo de #{payload.minimumStockLevel}#{payload.operation == 'RESERVATION' ? ', al reservar ' : ', al dar salida a '}#{payload.quantity} #{payload.unit}."
    link: "/almacen/materiales"
    throttle:
      window: 24h
      key: "#{payload.materialId}"

  - key: stock-reservation-touched-by-someone-else
    event: [stock.reservation.cancelled, stock.reservation.released]
    when: "payload.createdBy == vars['maintenance-service-account'] and event.actorUsername != vars['maintenance-service-account']"
    severity: WARNING
    audiences: [PROFILE:mto-maintenance-manager]
    channels: [inbox, email]
    title: "Reserva de mantenimiento #{event.type == 'stock.reservation.cancelled' ? 'cancelada' : 'liberada'}: #{payload.materialCode} para #{payload.projectCode}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha #{event.type == 'stock.reservation.cancelled' ? 'cancelado' : 'liberado'} en el almacen la reserva de #{payload.quantity} #{payload.unit} de #{payload.materialCode} para #{payload.projectCode} que habia hecho mantenimiento (#{payload.createdBy}). La linea de material de su orden se queda sin reserva: conviene sincronizarla."
    link: "/almacen/reservas"

  - key: stock-large-negative-adjustment
    event: stock.adjustment.registered
    when: "payload.direction == 'NEGATIVE' and payload.quantity >= vars['large-adjustment-threshold']"
    severity: WARNING
    audiences: [PROFILE:mto-warehouse-admin]
    channels: [inbox, email]
    title: "Ajuste negativo de #{payload.quantity} #{payload.unit} de #{payload.materialCode}"
    body: "#{event.actorUsername ?: 'Un proceso'} ha registrado un ajuste negativo de #{payload.quantity} #{payload.unit} de #{payload.materialCode}#{payload.materialName != null ? ' (' + payload.materialName + ')' : ''} en #{payload.warehouseCode}#{payload.externalReference != null ? ' (' + payload.externalReference + ')' : ''}#{payload.notes != null ? ': ' + payload.notes : ''}"
    link: "/almacen/movimientos"

  # --- El propio servicio -------------------------------------------------------------------------

  - key: system-source-stalled
    event: system.source.stalled
    severity: WARNING
    audiences: [PROFILE:mto-ops]
    channels: [inbox, email]
    title: "Fuente parada: #{payload.source}"
    body: "La fuente #{payload.source} lleva sin leerse desde #{payload.lastSuccessAt}: #{payload.error}"
    link: "/actividad?category=SYSTEM"
    throttle:
      window: 1h
      key: "#{payload.source}"

  - key: system-delivery-dead
    event: system.delivery.dead
    severity: WARNING
    audiences: [PROFILE:mto-ops]
