spring:
  application:
    name: mto-notification
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:dev}
  # La API es un resource server: no emite tokens ni guarda usuarios, solo valida los que emite
  # Keycloak. El JWK Set se descarga de forma perezosa, con lo que un Keycloak que aun no responde
  # no impide arrancar.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}

      # Cliente para las llamadas SALIENTES a la Admin API de Keycloak (eventos de acceso y de
      # administracion, direcciones de una audiencia), que se autentica contra este mismo Keycloak.
      # Mismo patron que mto-maintenance hacia mto-stock.
      client:
        provider:
          keycloak:
            # Se declara el endpoint de token en lugar de issuer-uri a proposito: el descubrimiento
            # por issuer es una llamada HTTP durante la creacion del bean, y con ella la aplicacion
            # no arrancaria si Keycloak no esta listo todavia.
            token-uri: ${KEYCLOAK_TOKEN_URI:http://auth.mto.local:8082/realms/mto/protocol/openid-connect/token}
        registration:
          # Cuenta de servicio de esta aplicacion. client_credentials y no password: el token
          # representa al servicio, no a una persona.
          mto-services:
            provider: keycloak
            client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:mto-notification-svc}
            # Vacio por defecto: con el lector de Keycloak apagado nadie pide un token y la
            # aplicacion arranca sin secreto.
            client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic

  # Este servicio solo CONSUME: no publica nada, asi que no hay publisher confirms ni returns que
  # configurar. Lo que hay debajo de listener.simple lo aplica Spring Boot a traves del
  # SimpleRabbitListenerContainerFactoryConfigurer; sin pasar por el, una factory declarada a mano
  # descarta todo este bloque en silencio.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        # Continua la traza que viaja en las cabeceras del mensaje: sin esto, consumir abriria una
        # traza nueva y el salto por la cola quedaria como un corte en el medio.
        observation-enabled: ${SPRING_RABBITMQ_LISTENER_OBSERVATION_ENABLED:true}
        concurrency: ${SPRING_RABBITMQ_LISTENER_CONCURRENCY:1}
        max-concurrency: ${SPRING_RABBITMQ_LISTENER_MAX_CONCURRENCY:5}
        prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:10}
        retry:
          # Reintentos acotados: agotados los intentos, el mensaje va a la DLQ. La otra mitad de esa
          # garantia -no reencolar lo rechazado- la fija el codigo y no este bloque.
          enabled: true
          max-retries: ${SPRING_RABBITMQ_LISTENER_MAX_RETRIES:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  # Los planificadores (lector de Keycloak, cierre de rafagas, despacho, purga) no pueden esperarse
  # entre si: el lector habla con la red.
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

  # Timeouts del RestClient que habla con la Admin API de Keycloak. Claves en plural de Boot 4.1.
  http:
    clients:
      connect-timeout: ${APP_KEYCLOAK_CONNECT_TIMEOUT:2s}
      read-timeout: ${APP_KEYCLOAK_READ_TIMEOUT:10s}

  # El SMTP por el que salen los avisos urgentes. En mto-platform es Mailpit, sin autenticacion;
  # en un entorno desplegado, el servidor de la organizacion con sus credenciales.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "mail.smtp.auth": ${SPRING_MAIL_SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${SPRING_MAIL_SMTP_STARTTLS:false}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 10000
      "mail.smtp.writetimeout": 10000

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  health:
    # Fuera del health: un broker caido deja de registrar actividad, pero la API sigue sirviendo la
    # bandeja y el registro. Contarlo como DOWN sacaria la instancia del balanceador por algo de lo
    # que se recupera sola.
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
    # Lo mismo con el SMTP: sin el, el correo espera en sus entregas y se reintenta; la bandeja y el
    # registro siguen. Y el indicador abre una conexion SMTP en cada sonda.
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
    # Los circuitos (el de Keycloak) entran como componente informativo, no deciden el global.
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

  # Trazabilidad distribuida. Mismos valores que el resto de servicios, a proposito.
  tracing:
    enabled: ${MTO_TRACING_ENABLED:true}
    sampling:
      # Un span NO muestreado sigue propagando su traceparent (con el flag a 00), asi que la cadena
      # entre servicios no se rompe por muestrear poco.
      probability: ${MTO_TRACING_SAMPLING_PROBABILITY:0.1}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        # Las metricas salen por Prometheus (ver /actuator/prometheus). El starter de OpenTelemetry
        # arrastra tambien un registro OTLP de metricas, y sin esto intentaria empujarlas a un
        # colector ademas de exponerlas.
        enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Activity log and notifications of the MTO domain
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    disable-swagger-default-url: true
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}

app:
  security:
    # Cliente de Keycloak que representa a esta API. Sus roles de cliente son los permisos que
    # comprueban la cadena de filtros y las anotaciones de seguridad de metodo.
    client-id: ${KEYCLOAK_CLIENT_ID:mto-notification-api}
    # Claim que se usa como nombre del principal, y por tanto como autor en las columnas de auditoria.
    principal-claim: preferred_username
    audience-validation-enabled: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:true}
    # Si la validacion de audiencia esta activa y este valor llega vacio, la aplicacion no arranca:
    # sin audiencia la API aceptaria cualquier token emitido por el realm, incluido el del frontal
    # de otra aplicacion.
    required-audience: ${KEYCLOAK_AUDIENCE:mto-notification-api}
    # Publicar /swagger-ui y /v3/api-docs sin autenticacion. Cerrado por defecto para que un entorno
    # desplegado nuevo no exponga el catalogo completo de endpoints por olvido: los perfiles de
    # desarrollo lo abren explicitamente.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
    cors:
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Correlation-Id
      exposed-headers:
        - Location
        - X-Correlation-Id
      allow-credentials: false
      max-age: ${APP_CORS_MAX_AGE:3600}

  # Un identificador por peticion: el que trae el gateway en X-Correlation-Id, o uno nuevo. Sale en
  # cada linea de log, en el cuerpo de cada error y en el registro de actividad.
  correlation:
    header-name: X-Correlation-Id
    max-length: 64

  # Con esto en false no se declara ninguna topologia ni escucha ningun consumidor: nadie abre una
  # conexion y la aplicacion arranca sin broker.
  rabbitmq:
    enabled: ${APP_RABBITMQ_ENABLED:true}
    # Una fuente por emisor: su exchange y su routing key son contrato del emisor; la cola, su
    # DLX y su DLQ son de este servicio, que es quien consume. La fuente de mto-stock se anade con
    # su fase.
    sources:
      master-data:
        exchange: ${APP_RABBITMQ_MASTER_DATA_EXCHANGE:mto.master-data.exchange}
        routing-key: "${APP_RABBITMQ_MASTER_DATA_ROUTING_KEY:mto.master-data.#}"
        queue: ${APP_RABBITMQ_MASTER_DATA_QUEUE:mto.notification.master-data.queue}
        dead-letter-exchange: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_EXCHANGE:mto.notification.master-data.queue.dlx}
        dead-letter-queue: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_QUEUE:mto.notification.master-data.queue.dlq}
        dead-letter-routing-key: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_ROUTING_KEY:mto.notification.master-data.queue.dlq}
        listener-enabled: ${APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED:true}
      # Lo que mto-configuration cuenta de si mismo: el final de un trabajo en segundo plano. Va por
      # su propio exchange para que quien escucha los datos maestros no lo reciba.
      configuration:
        exchange: ${APP_RABBITMQ_CONFIGURATION_EXCHANGE:mto.configuration.exchange}
        routing-key: "${APP_RABBITMQ_CONFIGURATION_ROUTING_KEY:mto.configuration.#}"
        queue: ${APP_RABBITMQ_CONFIGURATION_QUEUE:mto.notification.configuration.queue}
        dead-letter-exchange: ${APP_RABBITMQ_CONFIGURATION_DEAD_LETTER_EXCHANGE:mto.notification.configuration.queue.dlx}
        dead-letter-queue: ${APP_RABBITMQ_CONFIGURATION_DEAD_LETTER_QUEUE:mto.notification.configuration.queue.dlq}
        dead-letter-routing-key: ${APP_RABBITMQ_CONFIGURATION_DEAD_LETTER_ROUTING_KEY:mto.notification.configuration.queue.dlq}
        listener-enabled: ${APP_RABBITMQ_CONFIGURATION_LISTENER_ENABLED:true}
      # Las acciones administrativas de mto-users, con la persona que las hizo: lo que los eventos
      # de administracion de Keycloak no saben decir.
      users:
        exchange: ${APP_RABBITMQ_USERS_EXCHANGE:mto.users.exchange}
        routing-key: "${APP_RABBITMQ_USERS_ROUTING_KEY:mto.users.#}"
        queue: ${APP_RABBITMQ_USERS_QUEUE:mto.notification.users.queue}
        dead-letter-exchange: ${APP_RABBITMQ_USERS_DEAD_LETTER_EXCHANGE:mto.notification.users.queue.dlx}
        dead-letter-queue: ${APP_RABBITMQ_USERS_DEAD_LETTER_QUEUE:mto.notification.users.queue.dlq}
        dead-letter-routing-key: ${APP_RABBITMQ_USERS_DEAD_LETTER_ROUTING_KEY:mto.notification.users.queue.dlq}
        listener-enabled: ${APP_RABBITMQ_USERS_LISTENER_ENABLED:true}
      # Lo que mto-maintenance cuenta de si mismo (docs/06-messaging.md de ese repositorio): las
      # ordenes y sus transiciones, los defectos, las inspecciones, los turnos, las lineas de
      # material que el almacen rechaza o no contesta, los activos desactivados alli y, una vez al
      # dia, los preventivos a vencer. Sale de su outbox, con quien lo hizo y su correlacion.
      maintenance:
        exchange: ${APP_RABBITMQ_MAINTENANCE_EXCHANGE:mto.maintenance.exchange}
        routing-key: "${APP_RABBITMQ_MAINTENANCE_ROUTING_KEY:mto.maintenance.#}"
        queue: ${APP_RABBITMQ_MAINTENANCE_QUEUE:mto.notification.maintenance.queue}
        dead-letter-exchange: ${APP_RABBITMQ_MAINTENANCE_DEAD_LETTER_EXCHANGE:mto.notification.maintenance.queue.dlx}
        dead-letter-queue: ${APP_RABBITMQ_MAINTENANCE_DEAD_LETTER_QUEUE:mto.notification.maintenance.queue.dlq}
        dead-letter-routing-key: ${APP_RABBITMQ_MAINTENANCE_DEAD_LETTER_ROUTING_KEY:mto.notification.maintenance.queue.dlq}
        listener-enabled: ${APP_RABBITMQ_MAINTENANCE_LISTENER_ENABLED:true}

  # La Admin API de Keycloak: el lector de eventos de acceso y de administracion, y el directorio
  # con el que se resuelven las direcciones de una audiencia. Todo con la cuenta de servicio
  # mto-notification-svc (registro 'mto-services' de spring.security.oauth2.client).
  keycloak:
    base-url: ${KEYCLOAK_AUTH_SERVER_URL:http://auth.mto.local:8082}
    realm: ${KEYCLOAK_REALM:mto}
    client-registration-id: mto-services
    circuit-breaker:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: ${APP_KEYCLOAK_CIRCUIT_BREAKER_WAIT:30s}
      timeout: ${APP_KEYCLOAK_CIRCUIT_BREAKER_TIMEOUT:15s}
    events:
      # Con false no se sondea nada y la aplicacion arranca sin la cuenta de servicio.
      enabled: ${APP_KEYCLOAK_EVENTS_ENABLED:true}
      login-enabled: ${APP_KEYCLOAK_LOGIN_EVENTS_ENABLED:true}
      admin-enabled: ${APP_KEYCLOAK_ADMIN_EVENTS_ENABLED:true}
      poll-interval: ${APP_KEYCLOAK_EVENTS_POLL_INTERVAL:PT20S}
      initial-delay: ${APP_KEYCLOAK_EVENTS_INITIAL_DELAY:PT15S}
      page-size: 100
      # Tope de paginas por pasada: un arranque tras dias parado no recorre la tabla entera de una
      # vez; la marca avanza hasta donde llego y la siguiente pasada sigue.
      max-pages-per-poll: 50
      # Keycloak fecha el evento al construirlo y lo persiste al final de la peticion: uno con
      # time anterior a la marca puede hacerse visible despues. Se relee este solape; los
      # repetidos los para el inbox.
      overlap: PT2M
      # Primer arranque: desde hace una hora. Lo anterior lo tiene Keycloak (7 dias) si hace falta.
      initial-lookback: PT1H
      lease-ttl: PT2M
      # El cliente con el que mto-users administra el realm: sus cambios llevan este clientId en
      # los eventos de administracion y son 'de la aplicacion'; cualquier otro es un cambio hecho
      # fuera de ella.
      users-service-client-id: ${APP_KEYCLOAK_USERS_SERVICE_CLIENT_ID:mto-users-svc}
    directory:
      cache-ttl: PT5M
      page-size: 200
      # Los perfiles del dominio son los roles de realm con este prefijo: un rol de cliente se
      # concede tambien a traves de ellos, y Keycloak no expande compuestos al listar miembros.
      profile-prefix: mto-

  notification:
    # Las reglas: un YAML versionado con el codigo, sobrescribible por entorno.
    rules-location: ${APP_NOTIFICATION_RULES_LOCATION:classpath:notification-rules.yml}
    rules:
      variables:
        large-burst-threshold: ${APP_NOTIFICATION_LARGE_BURST_THRESHOLD:50}
        users-service-client-id: ${APP_KEYCLOAK_USERS_SERVICE_CLIENT_ID:mto-users-svc}
    access:
      streak:
        # Tres fallos del mismo usuario o de la misma IP en diez minutos: UN aviso.
        threshold: ${APP_NOTIFICATION_STREAK_THRESHOLD:3}
        window: ${APP_NOTIFICATION_STREAK_WINDOW:PT10M}
    users:
      # Un cambio hecho desde mto-users llega dos veces: por su evento (con la persona) y por el de
      # administracion de Keycloak (con la cuenta de servicio). El correlador funde los que caen a
      # menos de esto uno del otro, en cualquier orden de llegada.
      correlation-window: ${APP_NOTIFICATION_USERS_CORRELATION_WINDOW:PT2M}
    burst:
      # Una rafaga se cierra a los 30 s sin eventos nuevos, o a los 10 minutos de abrirse.
      idle-timeout: ${APP_NOTIFICATION_BURST_IDLE_TIMEOUT:PT30S}
      max-window: ${APP_NOTIFICATION_BURST_MAX_WINDOW:PT10M}
      sample-size: 20
      close-fixed-delay: ${APP_NOTIFICATION_BURST_CLOSE_DELAY:PT10S}
      close-enabled: ${APP_NOTIFICATION_BURST_CLOSE_ENABLED:true}
      # Lo que NO se agrega: una linea por evento, con su aviso.
      direct-deletions: track,station,profile,disconnector,section-insulator
      direct-creations: execution-package
    inbox:
      unread-count-cap: 100
      max-page-size: 100
    delivery:
      enabled: ${APP_NOTIFICATION_DELIVERY_ENABLED:true}
      fixed-delay: ${APP_NOTIFICATION_DELIVERY_FIXED_DELAY:PT15S}
      initial-delay: ${APP_NOTIFICATION_DELIVERY_INITIAL_DELAY:PT20S}
      batch-size: 50
      max-attempts: 8
      initial-retry-delay: PT30S
      max-retry-delay: PT1H
      # Una entrega reclamada y no resuelta (la instancia murio) vuelve a estar disponible.
      claim-visibility-timeout: PT5M
      # Tras confirmar una ingesta con entregas, se despacha sin esperar al planificador.
      immediate-dispatch: true
    email:
      enabled: ${APP_NOTIFICATION_EMAIL_ENABLED:true}
      from: ${APP_NOTIFICATION_EMAIL_FROM:notificaciones@mto.local}
      subject-prefix: "[MTO]"
      # Raiz absoluta para los enlaces del correo: el backoffice.
      link-base-url: ${APP_NOTIFICATION_LINK_BASE_URL:http://localhost:8085}
      # Tope por direccion y hora; lo que sobra se queda en la bandeja.
      max-per-hour: 20
    retention:
      purge-enabled: ${APP_NOTIFICATION_RETENTION_PURGE_ENABLED:true}
      cron: ${APP_NOTIFICATION_RETENTION_CRON:0 17 3 * * *}
      batch-size: 1000
      max-batches-per-run: 50
      # Keycloak caduca sus eventos a los 7 dias: este servicio es el archivo.
      activity:
        access: P90D
        users: P400D
        configuration: P400D
        maintenance: P400D
        stock: P400D
        system: P90D
      notifications: P180D
      inbox: P7D
      bursts: P1D
      throttles: P1D

  # Firma de los mensajes, sobre los bytes que viajan de verdad. EL MISMO VALOR que en los servicios
  # que publican. DISABLED no comprueba nada; OPTIONAL rechaza una firma que no cuadra pero acepta
  # lo que no puede comprobar; REQUIRED exige que todo mensaje llegue firmado y sea comprobable.
  messaging:
    signature:
      secret: ${MESSAGING_SIGNATURE_SECRET:}
      mode: ${MESSAGING_SIGNATURE_MODE:OPTIONAL}
